server.port=8080
spring.application.name=chatapp-backend

# Database Connection (TiDB Cloud Serverless / MySQL)
spring.datasource.url=jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/test?sslMode=VERIFY_IDENTITY
spring.datasource.username=37ZfgcHRHQJgXJk.root
spring.datasource.password=6TlL6kPlTdDJoTve
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Spring Data JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Actuator Health & Metrics
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Static Web UI Assets
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# Logging
logging.level.com.chatapp=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
